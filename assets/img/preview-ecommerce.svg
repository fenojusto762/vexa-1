<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="ecomBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1411"/>
      <stop offset="60%" stop-color="#10201a"/>
      <stop offset="100%" stop-color="#080e0c"/>
    </linearGradient>
    <linearGradient id="prodCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162721"/>
      <stop offset="100%" stop-color="#0e1b17"/>
    </linearGradient>
    <filter id="ecomGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#10b981" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Container do Navegador -->
  <rect width="800" height="500" rx="16" fill="url(#ecomBg)" stroke="#1e382e" stroke-width="2"/>

  <!-- Barra macOS -->
  <rect width="800" height="42" fill="#0d1814" rx="16"/>
  <rect y="26" width="800" height="16" fill="#0d1814"/>
  <circle cx="26" cy="21" r="6" fill="#ef4444"/>
  <circle cx="46" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="66" cy="21" r="6" fill="#10b981"/>
  
  <!-- Barra de endereço / URL -->
  <rect x="180" y="9" width="440" height="24" rx="12" fill="#14261f"/>
  <text x="400" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#86efac">
    🔒 https://aurabotanicals.com.br/alta-cosmetica
  </text>

  <!-- Header da Loja Virtual -->
  <rect y="42" width="800" height="58" fill="#0b1411" opacity="0.95"/>
  <text x="40" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="19" fill="#f8fafc">
    AURA <tspan fill="#10b981">BOTANICALS</tspan>
  </text>

  <!-- Links do Menu -->
  <text x="320" y="76" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1" letter-spacing="1">
    SÉRUMS &bull; ÓLEOS PRENSADOS &bull; CREMES &bull; FITOATIVOS
  </text>

  <!-- Botão Carrinho com Badge Dinâmico -->
  <rect x="670" y="54" width="95" height="34" rx="17" fill="#10b981"/>
  <text x="717" y="75" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#052e16">
    MEU PEDIDO (3)
  </text>

  <!-- Banner Promocional -->
  <rect x="40" y="112" width="720" height="66" rx="12" fill="#14261f" stroke="#1e382e" stroke-width="1"/>
  <text x="60" y="140" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff">
    Fitoativos Botânicos com Concentração Clínica &bull; 10% OFF
  </text>
  <text x="60" y="160" font-family="'Inter', sans-serif" font-size="10.5" fill="#86efac">
    🌱 100% Vegano Certificado Ecocert &bull; Prensagem a frio &bull; Despacho imediato em 24h para todo o Brasil
  </text>
  <rect x="635" y="128" width="105" height="32" rx="6" fill="#10b981"/>
  <text x="687" y="148" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="#052e16">
    CUPOM: AURA10
  </text>

  <!-- Vitrine de 3 Produtos com Ilustrações Realistas de Cosméticos -->
  <!-- PRODUTO 1: Frasco Âmbar Conta-gotas -->
  <g transform="translate(40, 192)">
    <rect width="225" height="280" rx="12" fill="url(#prodCardGrad)" stroke="#1e382e" stroke-width="1"/>
    
    <!-- Thumbnail com Frasco Ilustrado Âmbar -->
    <rect x="18" y="14" width="189" height="120" rx="8" fill="#0e1a15"/>
    <rect x="26" y="22" width="68" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
    <text x="60" y="34" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#34d399">MAIS VENDIDO</text>
    <text x="195" y="34" text-anchor="end" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">30 ml</text>

    <!-- Desenho do Frasco Âmbar -->
    <g transform="translate(100, 28) scale(0.65)">
      <rect x="42" y="5" width="16" height="16" rx="8" fill="#1e293b"/>
      <rect x="36" y="20" width="28" height="10" rx="2" fill="#d97706"/>
      <rect x="26" y="36" width="48" height="80" rx="8" fill="#92400e"/>
      <path d="M29 42 L33 42 L33 110 L29 110 Z" fill="#fbbf24" fill-opacity="0.35"/>
      <rect x="29" y="55" width="42" height="46" rx="2" fill="#fef3c7"/>
      <line x1="33" y1="64" x2="67" y2="64" stroke="#78350f" stroke-width="1.8"/>
      <line x1="36" y1="72" x2="64" y2="72" stroke="#92400e" stroke-width="1.2"/>
    </g>

    <!-- Infos do Produto -->
    <text x="18" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12.5" fill="#ffffff">Sérum C-Radiance 15%</text>
    <text x="18" y="168" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Vitamina C pura com camu-camu</text>
    
    <text x="18" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#34d399">R$ 89,90</text>
    <text x="90" y="200" font-family="'Inter', sans-serif" font-size="10.5" fill="#64748b" text-decoration="line-through">R$ 119,00</text>
    
    <rect x="18" y="218" width="189" height="36" rx="6" fill="#10b981"/>
    <text x="112" y="241" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" fill="#052e16">+ Adicionar ao Pedido</text>
  </g>

  <!-- PRODUTO 2: Frasco Verde Conta-gotas Óleo Rosa Mosqueta -->
  <g transform="translate(285, 192)">
    <rect width="225" height="280" rx="12" fill="url(#prodCardGrad)" stroke="#1e382e" stroke-width="1"/>
    
    <!-- Thumbnail com Frasco Esmeralda -->
    <rect x="18" y="14" width="189" height="120" rx="8" fill="#0e1a15"/>
    <rect x="26" y="22" width="70" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
    <text x="61" y="34" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#34d399">100% PURO</text>
    <text x="195" y="34" text-anchor="end" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">30 ml</text>

    <!-- Desenho do Frasco Esmeralda -->
    <g transform="translate(100, 28) scale(0.65)">
      <rect x="42" y="5" width="16" height="16" rx="8" fill="#064e3b"/>
      <rect x="36" y="20" width="28" height="10" rx="2" fill="#10b981"/>
      <rect x="26" y="36" width="48" height="80" rx="8" fill="#065f46"/>
      <path d="M29 42 L33 42 L33 110 L29 110 Z" fill="#6ee7b7" fill-opacity="0.35"/>
      <rect x="29" y="55" width="42" height="46" rx="2" fill="#ecfdf5"/>
      <line x1="33" y1="64" x2="67" y2="64" stroke="#065f46" stroke-width="1.8"/>
      <circle cx="50" cy="78" r="4" fill="#10b981"/>
    </g>

    <text x="18" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12.5" fill="#ffffff">Óleo Rosa Mosqueta &amp; Cacay</text>
    <text x="18" y="168" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Prensagem a frio e regeneração</text>
    
    <text x="18" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#34d399">R$ 74,50</text>
    <text x="90" y="200" font-family="'Inter', sans-serif" font-size="10.5" fill="#64748b" text-decoration="line-through">R$ 92,00</text>
    
    <rect x="18" y="218" width="189" height="36" rx="6" fill="#10b981"/>
    <text x="112" y="241" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" fill="#052e16">+ Adicionar ao Pedido</text>
  </g>

  <!-- PRODUTO 3: Pote Vidro com Tampa Bambu Creme Noturno -->
  <g transform="translate(530, 192)">
    <rect width="225" height="280" rx="12" fill="url(#prodCardGrad)" stroke="#1e382e" stroke-width="1"/>
    
    <!-- Thumbnail com Pote Bambu -->
    <rect x="18" y="14" width="189" height="120" rx="8" fill="#0e1a15"/>
    <rect x="26" y="22" width="70" height="18" rx="9" fill="#10b981" fill-opacity="0.2"/>
    <text x="61" y="34" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" fill="#34d399">HIALURÔNICO</text>
    <text x="195" y="34" text-anchor="end" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#94a3b8">50 g</text>

    <!-- Desenho do Pote de Bambu -->
    <g transform="translate(90, 42) scale(0.68)">
      <rect x="15" y="10" width="80" height="20" rx="4" fill="#d97706"/>
      <line x1="17" y1="18" x2="93" y2="18" stroke="#b45309" stroke-width="1.2"/>
      <rect x="20" y="30" width="70" height="55" rx="6" fill="#334155" fill-opacity="0.8"/>
      <rect x="25" y="42" width="60" height="32" rx="2" fill="#ffffff" fill-opacity="0.95"/>
      <line x1="32" y1="52" x2="78" y2="52" stroke="#0f172a" stroke-width="1.8"/>
      <line x1="38" y1="60" x2="72" y2="60" stroke="#10b981" stroke-width="1.4"/>
    </g>

    <text x="18" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12.5" fill="#ffffff">Creme Noturno Bio-Hialurônico</text>
    <text x="18" y="168" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Matriz 8D de hidratação contínua</text>
    
    <text x="18" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#34d399">R$ 109,90</text>
    <text x="96" y="200" font-family="'Inter', sans-serif" font-size="10.5" fill="#64748b" text-decoration="line-through">R$ 139,00</text>
    
    <rect x="18" y="218" width="189" height="36" rx="6" fill="#10b981"/>
    <text x="112" y="241" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" fill="#052e16">+ Adicionar ao Pedido</text>
  </g>
</svg>
