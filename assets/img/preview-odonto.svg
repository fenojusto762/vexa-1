      <text x="12" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#38bdf8">3x Mais</text>
      <text x="12" y="102" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">Cicatrização Rápida</text>

      <!-- Box 4 -->
      <rect x="142" y="60" width="130" height="52" rx="8" fill="#07111c" stroke="#1e3a5f" stroke-width="1"/>
      <text x="154" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#34d399">0 Moldes</text>
      <text x="154" y="102" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">Scanner Digital Trios</text>
    </g>

    <!-- Itens de Garantia Clínica -->
    <g transform="translate(20, 182)">
      <path d="M 0 6 L 4 10 L 10 2" stroke="#34d399" stroke-width="2" fill="none"/>
      <text x="18" y="8" font-family="'Inter', sans-serif" font-size="9.5" fill="#cbd5e1">Tomografia Computadorizada Cone Beam HD</text>

      <path d="M 0 26 L 4 30 L 10 22" stroke="#34d399" stroke-width="2" fill="none"/>
      <text x="18" y="28" font-family="'Inter', sans-serif" font-size="9.5" fill="#cbd5e1">Planejamento e Mock-up Digital 3D prévio</text>

      <path d="M 0 46 L 4 50 L 10 42" stroke="#34d399" stroke-width="2" fill="none"/>
      <text x="18" y="48" font-family="'Inter', sans-serif" font-size="9.5" fill="#cbd5e1">Cerâmica Alemã Pura E-Max de Alta Resistência</text>
    </g>

    <!-- Credencial Médica Oficial -->
    <line x1="20" y1="248" x2="290" y2="248" stroke="#1e3a5f" stroke-width="1"/>
    <text x="20" y="266" font-family="'Inter', sans-serif" font-size="9.5" fill="#94a3b8">
      Resp. Técnico: <tspan fill="#ffffff" font-weight="700">Dr. Rafael Silva</tspan> &bull; CRO-DF 14.890
    </text>
  </g>
</svg>
