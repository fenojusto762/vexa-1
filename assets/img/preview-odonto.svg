    <!-- Métricas 3D em 2x2 -->
    <g transform="translate(18, 50)">
      <!-- Box 1 -->
      <rect width="130" height="52" rx="8" fill="#07111c" stroke="#1e3a5f" stroke-width="1"/>
      <text x="12" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#38bdf8">99.8%</text>
      <text x="12" y="42" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">Precisão Guia 3D</text>

      <!-- Box 2 -->
      <rect x="142" width="130" height="52" rx="8" fill="#07111c" stroke="#1e3a5f" stroke-width="1"/>
      <text x="154" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#34d399">-60%</text>
      <text x="154" y="42" font-family="'Inter', sans-serif" font-size="8.5" fill="#94a3b8">Tempo Cirúrgico</text>

      <!-- Box 3 -->
