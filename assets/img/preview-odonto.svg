  </text>

  <!-- Card de Avaliação 5 Estrelas -->
  <g transform="translate(40, 316)">
    <rect width="260" height="46" rx="8" fill="#0c1d2e" stroke="#1e3a5f" stroke-width="1"/>
    <text x="14" y="22" font-size="13" fill="#fbbf24">★★★★★</text>
    <text x="80" y="21" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#f8fafc">4.9 / 5.0 no Google</text>
    <text x="14" y="37" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">+320 pacientes atendidos e satisfeitos</text>
  </g>

  <!-- Botão de Agendamento Rápido -->
  <rect x="40" y="380" width="230" height="46" rx="8" fill="#25d366"/>
  <text x="155" y="408" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="12.5" fill="#ffffff">
    QUERO AGENDAR AVALIAÇÃO
  </text>

  <!-- Painel de Alta Tecnologia 3D (Substitui foto fictícia por dados técnicos reais) -->
  <g transform="translate(450, 145)" filter="url(#cardGlow)">
    <rect width="310" height="280" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    
    <!-- Topo do Card Tecnológico -->
