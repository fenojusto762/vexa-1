<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="odontoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111c"/>
      <stop offset="60%" stop-color="#0c1d2e"/>
      <stop offset="100%" stop-color="#060e17"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e2338"/>
      <stop offset="100%" stop-color="#081624"/>
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container do Navegador -->
  <rect width="800" height="500" rx="16" fill="url(#odontoBg)" stroke="#1e3a5f" stroke-width="2"/>

  <!-- Barra de controle de janela estilo macOS -->
  <rect width="800" height="42" fill="#091522" rx="16"/>
  <rect y="26" width="800" height="16" fill="#091522"/>
  <circle cx="26" cy="21" r="6" fill="#ef4444"/>
  <circle cx="46" cy="21" r="6" fill="#f59e0b"/>
  <circle cx="66" cy="21" r="6" fill="#10b981"/>
  
  <!-- Barra de endereço / URL -->
  <rect x="180" y="9" width="440" height="24" rx="12" fill="#112538"/>
  <text x="400" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#7dd3fc">
    🔒 https://drrafaelsilva.com.br/odontologia-digital-3d
  </text>

  <!-- Top bar / Aviso de Agendamento -->
  <rect y="42" width="800" height="26" fill="#0369a1"/>
  <text x="400" y="59" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">
    ⚡ Atendimento com hora marcada em Brasília • Cirurgia Guiada e Lentes Dentais 3D
  </text>

  <!-- Navbar -->
  <rect y="68" width="800" height="56" fill="#07111c" opacity="0.95"/>
  <text x="40" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="17" fill="#ffffff">
    DR. RAFAEL SILVA <tspan fill="#38bdf8" font-size="11" font-weight="600">| CIRURGIA GUIADA &amp; LENTES 3D</tspan>
  </text>
  <rect x="625" y="80" width="135" height="32" rx="16" fill="#25d366"/>
  <text x="692" y="101" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff">
    Agendar Avaliação
  </text>

  <!-- Hero Content da Landing Page -->
  <rect x="40" y="148" width="200" height="22" rx="11" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
  <text x="140" y="163" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#38bdf8">
