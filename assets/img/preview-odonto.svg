  </text>
  <text x="40" y="238" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="26" fill="url(#cyanGrad)">
    &amp; Lentes Dentais 3D.
  </text>

  <text x="40" y="272" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">
