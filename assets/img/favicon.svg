<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f59b"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="favSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00f59b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo Moderno com Borda Neon -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#090d16" stroke="#1f293d" stroke-width="2"/>
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="url(#favNeon)" stroke-width="1.2" opacity="0.65"/>

  <!-- Monograma VX Centralizado -->
  <g transform="translate(6, 6) scale(0.325)" filter="url(#favGlow)">
    <!-- Letra V -->
    <path d="M 20 12 L 33 12 L 45 41 L 39 52 L 30 52 Z" fill="url(#favSilver)"/>
    <path d="M 48 52 L 53 41 L 65 12 L 78 12 L 58 52 Z" fill="url(#favNeon)"/>

    <!-- Letra X -->
    <path d="M 88 12 L 100 12 L 138 52 L 126 52 Z" fill="url(#favSilver)"/>
    <path d="M 88 52 L 100 52 L 107 41 L 98 41 Z" fill="url(#favNeon)"/>
    <path d="M 119 23 L 128 23 L 138 12 L 126 12 Z" fill="url(#favNeon)"/>
    <circle cx="147" cy="14" r="3.5" fill="#00f59b"/>
  </g>
</svg>
